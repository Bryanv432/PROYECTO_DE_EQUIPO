[pytest]
# Configuración de pytest (tiene prioridad sobre [tool.pytest.ini_options] de pyproject.toml).
pythonpath = .
testpaths = tests
# Avisos internos de librerías de terceros (Evidently, Litestar, MLflow) que no vienen de nuestro código.
filterwarnings =
    ignore::DeprecationWarning
    ignore::SyntaxWarning
    ignore::FutureWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
