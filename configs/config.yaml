# Configuración central del proyecto.
# Todos los scripts y flows leen de aquí: no hay rutas ni hiperparámetros escritos a mano en el código.

datos:
  ruta: data/car_sales_dataset.csv   # relativa a la raíz del repositorio
  num_registros: 20000               # filas del dataset sintético (15.000 a 30.000)
  semilla: 42                        # misma semilla => mismo dataset en cada ejecución
  columnas_esperadas:
    - fecha_venta
    - marca
    - tipo_vehiculo
    - año_modelo
    - kilometraje
    - precio_lista
    - precio_venta

modelo:
  objetivo: precio_venta
  variables_categoricas: [marca, tipo_vehiculo]
  variables_numericas: [año_modelo, kilometraje, precio_lista]
  tipo: random_forest                # random_forest | linear_regression
  hiperparametros:
    n_estimators: 200
    max_depth: 12
    random_state: 42
  test_size: 0.2
  semilla_split: 42

mlflow:
  experimento: precio-vehiculos-a1
  nombre_run: rf-baseline
